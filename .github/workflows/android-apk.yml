name: Compilar APK Android (TCG Card Forge)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Pruebas y APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Desempaquetar proyecto si se subió en paquete único
        run: |
          if [ -f TCGCardForge-Android.b64.txt ]; then
            base64 -d TCGCardForge-Android.b64.txt > TCGCardForge-Android.zip
          fi
          if [ -f TCGCardForge-Android.zip ]; then
            unzip -o TCGCardForge-Android.zip
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK de depuración (Debug)
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TCG-Card-Forge-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
