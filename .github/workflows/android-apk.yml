name: Compilar APK Android (TCG Card Forge)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Pruebas y APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Desempaquetar proyecto si se subió en paquete único
        run: |
          B64_FILE=$(ls TCGCardForge-Android*.txt 2>/dev/null | head -n 1 || true)
          if [ -n "$B64_FILE" ]; then
            tr -d '\r\n ' < "$B64_FILE" | base64 -d > TCGCardForge-Android.zip
          fi
          ZIP_FILE=$(ls TCGCardForge-Android*.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi
          if [ ! -f build.gradle.kts ]; then
            echo "ERROR: Falta subir TCGCardForge-Android.b64.txt en la raíz del repositorio."
            exit 1
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceptar licencias de Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Ejecutar pruebas unitarias
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de depuración (Debug)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: TCG-Card-Forge-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
